# Diccionario de datos del Proyecto - Minciencias
# ==========================================================
# Proposito: documentar las fuentes principales y auxiliares necesarias
# para construir un seguimiento longitudinal por investigador y analizar
# cambios en su clasificacion, trayectoria territorial y caracteristicas asociadas.

fuentes:
  - nombre: "Investigadores Reconocidos 2017"
    plataforma: "datos.gov.co"
    socrata_id: "7669-9v24"
    url: "https://www.datos.gov.co/resource/7669-9v24.csv"
    formato: "csv"
    periodicidad: "anual"
    tamanio_registros: 13001
    notas: "Resultados convocatoria 781 de 2017 de Minciencias."

  - nombre: "Investigadores Reconocidos 2019"
    plataforma: "datos.gov.co"
    socrata_id: "853n-fj7y"
    url: "https://www.datos.gov.co/resource/853n-fj7y.csv"
    formato: "csv"
    periodicidad: "anual"
    tamanio_registros: 16796
    notas: "Resultados convocatoria de medicion de investigadores 2019."

  - nombre: "Investigadores Reconocidos 2021"
    plataforma: "datos.gov.co"
    socrata_id: "bqtm-4y2h"
    url: "https://www.datos.gov.co/resource/bqtm-4y2h.csv"
    formato: "csv"
    periodicidad: "anual"
    tamanio_registros: 21094
    notas: "Resultados convocatoria 894 de 2021 (Plataforma ScienTI)."

campos_clave_analiticos:
  llave_unica_seguimiento: ID_PERSONA_PR
  variable_tiempo: ANO_CONVO
  variable_categoria_codigo: ID_CLAS_PR
  variable_categoria_nombre: NME_CLASIFICACION_PR
  variable_categoria_orden: ORDEN_CLAS_PR
  variables_territoriales:
    - NME_REGION_NAC_PR
    - NME_DEPARTAMENTO_NAC_PR
    - NME_MUNICIPIO_NAC_PR
    - COD_DANE_NAC_PR
    - NME_REGION_RES_PR
    - NME_DEPARTAMENTO_RES_PR
    - NME_MUNICIPIO_RES_PR
    - COD_DANE_RES_PR

