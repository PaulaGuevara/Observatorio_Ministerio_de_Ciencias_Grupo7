  - nombre: ID_CLAS_PR
    descripcion: "Categoría alcanzada por el investigador (ID)"
    tipo: texto

  - nombre: NME_CLASIFICACION_PR
    descripcion: "Categoría alcanzada por el investigador (nombre)"
    tipo: texto

  - nombre: ORDEN_CLAS_PR
    descripcion: "Orden de importancia de la categoría"
    tipo: numero

  - nombre: EDAD_ANOS_PR
    descripcion: "Edad en años al cierre de la convocatoria"
    tipo: numero

  - nombre: NME_PAIS_RES_PR
    descripcion: "País de residencia"
    tipo: texto

  - nombre: NME_REGION_RES_PR
    descripcion: "Región de residencia"
    tipo: texto

  - nombre: NME_DEPARTAMENTO_RES_PR
    descripcion: "Departamento de residencia"
    tipo: texto

  - nombre: NME_MUNICIPIO_RES_PR
    descripcion: "Municipio de residencia"
    tipo: texto

  - nombre: COD_DANE_RES_PR
    descripcion: "Código DANE del municipio de residencia"
    tipo: texto

  - nombre: ID_VICTIMA_CONFLICTO
    descripcion: "Indica si el investigador es víctima del conflicto armado"
    tipo: texto

  - nombre: TXT_GRUPO_ETNICO
    descripcion: "Grupo étnico del investigador"
    tipo: texto

  - nombre: TXT_POBLACION_DISCA
    descripcion: "Indica si el investigador es población en situación de discapacidad"
    tipo: texto

  - nombre: INST_FILIA
    descripcion: "Lista de instituciones de filiación separadas por PIPE"
    tipo: texto
