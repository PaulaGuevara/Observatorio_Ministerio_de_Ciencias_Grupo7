# catalogo.yaml
# Catálogo de fuentes de datos del Observatorio de Ciencia, Tecnología e
# Innovación — Investigadores Reconocidos Minciencias — Grupo 7
# ---------------------------------------------------------------------------

fuentes:
  - id: investigadores_2017
    nombre: "Investigadores Reconocidos por Convocatoria 2017"
    anio: 2017
    url: "https://minciencias.gov.co/ciudadano/datosabiertos"
    formato: [csv, xlsx]
    registros: 13001
    columnas: 30
    ruta_local: "datos/tarea_join/investigadores_consolidado.csv"
    descripcion: >
      Base de datos de investigadores reconocidos en la convocatoria 2017
      del Ministerio de Ciencia, Tecnología e Innovación de Colombia.

  - id: investigadores_2019
    nombre: "Investigadores Reconocidos por Convocatoria 2019"
    anio: 2019
    url: "https://minciencias.gov.co/ciudadano/datosabiertos"
    formato: [csv, xlsx]
    registros: 16796
    columnas: 30
    ruta_local: "datos/tarea_join/investigadores_consolidado.csv"
    descripcion: >
      Base de datos de investigadores reconocidos en la convocatoria 2019
      del Ministerio de Ciencia, Tecnología e Innovación de Colombia.

  - id: investigadores_2021
    nombre: "Investigadores Reconocidos por Convocatoria 2021"
    anio: 2021
    url: "https://minciencias.gov.co/ciudadano/datosabiertos"
    formato: [csv, xlsx]
    registros: 21094
    columnas: 30
    ruta_local: "datos/tarea_join/investigadores_consolidado.csv"
    descripcion: >
      Base de datos de investigadores reconocidos en la convocatoria 2021
      del Ministerio de Ciencia, Tecnología e Innovación de Colombia.

  - id: consolidado
    nombre: "Investigadores Consolidado (2017–2021)"
    anios: [2017, 2019, 2021]
    url: ~
    formato: [csv, xlsx]
    registros: 50891
    columnas: 30
    ruta_local_csv: "datos/tarea_join/investigadores_consolidado.csv"
    ruta_local_xlsx: "datos/tarea_join/investigadores_consolidado.xlsx"
    descripcion: >
      Dataset consolidado que integra las tres convocatorias (2017, 2019 y
      2021) mediante concatenación directa (pd.concat). Generado por
      notebooks/tarea_join/codigo_join.py.

variables:
  - nombre: ID_CONVOCATORIA
    descripcion: "Identificador de la convocatoria"
    tipo: texto

  - nombre: NME_CONVOCATORIA
    descripcion: "Nombre de la convocatoria"
    tipo: texto

  - nombre: ANO_CONVO
    descripcion: "Año de realización de la convocatoria"
    tipo: fecha

  - nombre: ID_PERSONA_PR
    descripcion: "Identificador único del investigador"
    tipo: texto

  - nombre: ID_AREA_CON_PR
    descripcion: "Identificador del área de conocimiento OCDE principal"
    tipo: texto

  - nombre: NME_ESP_AREA_PR
    descripcion: "Especialidad del área de conocimiento OCDE principal"
    tipo: texto

  - nombre: NME_AREA_PR
    descripcion: "Área de conocimiento OCDE principal"
    tipo: texto

  - nombre: NME_GRAN_AREA_PR
    descripcion: "Gran área de conocimiento OCDE principal"
    tipo: texto

  - nombre: NME_GENERO_PR
    descripcion: "Género del investigador"
    tipo: texto

  - nombre: NME_PAIS_NAC_PR
    descripcion: "País de nacimiento"
    tipo: texto

  - nombre: NME_REGION_NAC_PR
    descripcion: "Región de nacimiento"
    tipo: texto

  - nombre: NME_DEPARTAMENTO_NAC_PR
    descripcion: "Departamento de nacimiento"
    tipo: texto

  - nombre: NME_MUNICIPIO_NAC_PR
    descripcion: "Municipio de nacimiento"
    tipo: texto

  - nombre: COD_DANE_NAC_PR
    descripcion: "Código DANE del municipio de nacimiento"
    tipo: texto

  - nombre: ID_NIV_FORMACION_PR
    descripcion: "Nivel de formación máximo (ID)"
    tipo: texto

  - nombre: NME_NIV_FORM_PR
    descripcion: "Nivel de formación máximo (nombre)"
    tipo: texto

  - nombre: NRO_ORDEN_FORM_PR
    descripcion: "Orden de importancia del nivel de formación"
